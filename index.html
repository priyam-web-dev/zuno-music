<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="referrer"
      content="strict-origin-when-cross-origin"
    />

    <!-- Primary SEO -->
    <title>P's Favourites — Music, Playlists & Moments</title>

    <meta
      name="description"
      content="P's Favourites — a personal collection of favourite music, playlists and memorable moments."
    />

    <meta name="robots" content="index, follow" />

    <link
      rel="canonical"
      href="https://p-fvrts.vercel.app/"
    />

    <!-- Browser Theme -->
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="P's Favourites"
    />

    <meta
      property="og:description"
      content="Music, playlists and moments collected in one place."
    />

    <meta
      property="og:url"
      content="https://p-fvrts.vercel.app/"
    />

    <meta
      property="og:type"
      content="website"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="P's Favourites"
    />

    <meta
      name="twitter:description"
      content="Music, playlists and moments collected in one place."
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "P's Favourites",
      "url": "https://p-fvrts.vercel.app/",
      "description": "P's Favourites — a personal collection of favourite music, playlists and memorable moments."
    }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
