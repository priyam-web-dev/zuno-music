<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="referrer"
      content="strict-origin-when-cross-origin"
    />

    <!-- Primary SEO -->
    <title>P's Favourites — Music, Playlists & Moments</title>

    <meta
      name="description"
      content="P's Favourites — a personal collection of favourite songs, music, playlists, artists and memorable moments."
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <link
      rel="canonical"
      href="https://p-fvrts.vercel.app/"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/favicon.png"
    />

    <link
      rel="apple-touch-icon"
      href="/favicon.png"
    />

    <!-- Browser Theme -->
    <meta
      name="theme-color"
      content="#0a0a0a"
    />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="P's Favourites — Music, Playlists & Moments"
    />

    <meta
      property="og:description"
      content="Explore favourite songs, music, playlists, artists and memorable moments on P's Favourites."
    />

    <meta
      property="og:url"
      content="https://p-fvrts.vercel.app/"
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="P's Favourites"
    />

    <meta
      property="og:locale"
      content="en_IN"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="P's Favourites — Music, Playlists & Moments"
    />

    <meta
      name="twitter:description"
      content="Explore favourite songs, music, playlists, artists and memorable moments on P's Favourites."
    />

    <!-- Website Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "P's Favourites",
        "alternateName": [
          "P's Favourites Music",
          "P's Favourite Songs",
          "P's Playlists",
          "P's Favourite Music"
        ],
        "url": "https://p-fvrts.vercel.app/"
      }
    </script>

    <!-- Person / Website Relationship -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "P's Favourites",
        "description": "A personal collection of favourite songs, music, playlists, artists and memorable moments.",
        "url": "https://p-fvrts.vercel.app/",
        "isPartOf": {
          "@type": "WebSite",
          "name": "P's Favourites",
          "url": "https://p-fvrts.vercel.app/"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
