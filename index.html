<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="referrer"
      content="strict-origin-when-cross-origin"
    />

    <!-- =========================
         PRIMARY SEO
    ========================== -->

    <title>
      P's Favourites — Music Playlist & Favourite Songs
    </title>

    <meta
      name="description"
      content="P's Favourites is a personal music playlist and collection of favourite songs, artists and musical moments."
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <link
      rel="canonical"
      href="https://p-fvrts.vercel.app/"
    />

    <meta
      name="theme-color"
      content="#0a0a0a"
    />

    <!-- =========================
         WEBSITE IDENTITY
    ========================== -->

    <meta
      property="og:site_name"
      content="P's Favourites"
    />

    <!-- =========================
         OPEN GRAPH
    ========================== -->

    <meta
      property="og:title"
      content="P's Favourites — Music Playlist & Favourite Songs"
    />

    <meta
      property="og:description"
      content="A personal collection of favourite songs, artists, playlists and musical moments."
    />

    <meta
      property="og:url"
      content="https://p-fvrts.vercel.app/"
    />

    <meta
      property="og:type"
      content="website"
    />

    <!-- =========================
         TWITTER / X
    ========================== -->

    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="P's Favourites — Music Playlist & Favourite Songs"
    />

    <meta
      name="twitter:description"
      content="A personal collection of favourite songs, artists, playlists and musical moments."
    />

    <!-- =========================
         STRUCTURED DATA
    ========================== -->

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "P's Favourites",
      "alternateName": [
        "P's Music Playlist",
        "P's Favourite Songs",
        "P's Favourites Music"
      ],
      "url": "https://p-fvrts.vercel.app/",
      "description": "P's Favourites is a personal music playlist and collection of favourite songs, artists and musical moments."
    }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
